<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121719"><title>Soundux • Controle</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#121719;color:#eef4f2}*{box-sizing:border-box}body{margin:0;padding:24px 20px 110px;max-width:1000px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#69d6ad;letter-spacing:.16em;font-size:11px}h1{font-size:30px;margin:4px 0}p{color:#a1b1ad;font-size:14px}button,input{font:inherit}button{cursor:pointer;border:1px solid #33423e;border-radius:14px;background:#202b28;color:#eef4f2;padding:13px 17px;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible,input:focus-visible{outline:2px solid #69d6ad;outline-offset:3px}.sync{font-size:13px}input{width:100%;padding:15px;border:1px solid #33423e;border-radius:14px;background:#19211f;color:inherit;margin:16px 0}nav{display:flex;gap:8px;overflow:auto;padding-bottom:14px}nav button{white-space:nowrap}nav button.active{background:#69d6ad;color:#122019;border-color:#69d6ad}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.sound{text-align:left;min-height:130px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;word-break:break-word;background:linear-gradient(145deg,#24332d,#1c2622)}.sound span{font-size:25px;color:#69d6ad}.sound:active{transform:scale(.96);background:#365b47}.sound b{font-size:15px;line-height:1.4}footer{position:fixed;bottom:0;left:0;right:0;padding:16px 20px;background:#121719ed;backdrop-filter:blur(12px);display:flex;justify-content:center}.stop{width:min(960px,100%);background:#562e33;border-color:#875058;font-weight:650}#status{min-height:24px;font-size:13px;margin:12px 0;color:#a1b1ad}#status.error{color:#ffa5a5}.empty{padding:30px 0;color:#a1b1ad}#output{font-size:12px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sound{min-width:0;min-height:44px;height:44px;padding:10px 12px;border-radius:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}.sound b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:22px;font-weight:600}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<header><div><small>CONTROLE REMOTO</small><h1>Soundux<span style="color:#69d6ad">.</span></h1></div><button class="sync" id="sync">↻ Sincronizar</button></header><p>Escolha um som. Ele toca no seu computador.</p><div id="status" role="status" aria-live="polite">Conectando…</div><input id="search" type="search" placeholder="Buscar áudio…" aria-label="Buscar áudio"><nav id="tabs" aria-label="Abas"></nav><main class="grid" id="sounds"></main><p id="output"></p><footer><button class="stop" id="stop">■ Parar todos os sons</button></footer>
<script>
let state={tabs:[]},selected=null,working=false;
const $=id=>document.getElementById(id);
function message(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function render(){
 $('tabs').replaceChildren();for(const tab of state.tabs){const b=document.createElement('button');b.textContent=tab.name+' · '+tab.sounds.length;b.className=tab.id===selected?'active':'';b.onclick=()=>{selected=tab.id;render();};$('tabs').append(b);}
 $('sounds').replaceChildren();const tab=state.tabs.find(t=>t.id===selected);const query=$('search').value.toLocaleLowerCase();
 for(const sound of tab?.sounds||[]){if(!sound.name.toLocaleLowerCase().includes(query))continue;const b=document.createElement('button');b.className='sound';b.title=sound.name;b.setAttribute('aria-label',sound.name);const name=document.createElement('b');const chars=Array.from(sound.name.replace(/\s+/g,' ').trim());name.textContent=chars.length>22?chars.slice(0,21).join('')+'…':chars.join('');b.append(name);b.onclick=()=>command('play',{id:sound.id},'Comando enviado: '+sound.name);$('sounds').append(b);}
 if(!$('sounds').children.length){const p=document.createElement('p');p.className='empty';p.textContent=state.tabs.length?'Nenhum áudio nesta busca. Adicione sons no Soundux e sincronize.':'Adicione uma aba no Soundux e toque em Sincronizar.';$('sounds').append(p);}
 $('output').textContent='Saída configurada no PC: '+(state.outputs?.join(', ')||'padrão');
}
async function load(){state=await api('state');if(!state.tabs.some(t=>t.id===selected))selected=state.tabs[0]?.id;render();}
async function command(path,body,label){if(working)return;working=true;try{await api(path,body);message(label);navigator.vibrate?.(25);}catch(e){message(e.message,true);}finally{working=false;}}
$('search').oninput=render;$('stop').onclick=()=>command('stop',{},'Comando de parada enviado.');
$('sync').onclick=async()=>{if(working)return;working=true;$('sync').disabled=true;message('Atualizando as abas e mantendo os atalhos desativados…');try{await api('sync',{});await load();message('Abas sincronizadas · controle sem teclado.');}catch(e){message(e.message,true);}finally{working=false;$('sync').disabled=false;}};
load().then(()=>message('Conectado ao PC · pronto para tocar')).catch(e=>message(e.message,true));
setInterval(()=>{if(!working)load().catch(e=>message(e.message,true));},10000);
</script></html>
